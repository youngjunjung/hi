# LiteLLM 프록시 설정
# Open WebUI 모델 목록에는 아래 model_name이 그대로 보입니다.
# 모델/가격은 https://docs.anthropic.com 의 최신 목록을 확인하세요 (2026-11 기준).

model_list:
  # 기본 모델: 가장 똑똑함. 복잡한 작업, 도구를 여러 번 쓰는 작업에.
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # 빠르고 저렴: 일상 대화, 요약, 간단한 도구 호출에.
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # 가장 저렴: 제목 생성, 태그, 분류 같은 보조 작업(Open WebUI "작업 모델")에.
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # 다른 공급자를 추가하려면 예: (OPENAI_API_KEY 필요)
  # - model_name: gpt
  #   litellm_params:
  #     model: openai/<모델ID>
  #     api_key: os.environ/OPENAI_API_KEY

  # 로컬 모델 (서버에 Ollama 설치 시):
  # - model_name: local
  #   litellm_params:
  #     model: ollama_chat/<모델명>
  #     api_base: http://host.docker.internal:11434

litellm_settings:
  # 모델이 지원하지 않는 파라미터(예: 최신 Claude에서 거부되는 temperature)는 자동으로 제거
  drop_params: true
  request_timeout: 600
  # 응답 실패 시 다음 모델로 재시도
  fallbacks:
    - claude-opus: ["claude-sonnet"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # 월 예산 상한 등은 LiteLLM UI(127.0.0.1:4000/ui)에서 가상 키별로 설정 가능
